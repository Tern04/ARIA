[package]
name = "aria"
version = "0.1.0"
description = "ARIA — cross-platform desktop HUD dashboard"
authors = ["Tern04"]
edition = "2021"

[lib]
# _lib suffix avoids name collision with the bin on Windows (rust-lang/cargo#8519)
name = "aria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for transparent windows on macOS
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.36"
tokio = { version = "1", features = ["time", "sync", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Discord gateway websocket; rustls to share the TLS stack with reqwest.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
imap = "2"
# same minor as imap 2.4's internal dep; needed to name Envelope in signatures
imap-proto = "0.10"
native-tls = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rfc2047-decoder = "1"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Machine-bound encryption for the macOS dev-mode secrets file.
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
