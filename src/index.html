<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="hud">
      <header class="hud-header">
        <div class="brand-group">
          <span class="brand">ARIA</span>
          <button class="pin-toggle" id="pin-toggle" aria-label="Pin HUD above windows" title="Pin above windows">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5" />
              <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
            </svg>
          </button>
          <span class="mod-hint" id="mod-hint">⌥ interact</span>
        </div>
        <div class="statusbar" aria-hidden="true">
          <span class="status-item" id="status-stag"><i></i>STAG</span>
          <span class="status-item" id="status-github"><i></i>GITHUB</span>
          <span class="status-item" id="status-mail"><i></i>MAIL</span>
          <span class="status-item" id="status-music"><i></i>MUSIC</span>
        </div>
        <div class="hud-clock">
          <span id="clock-time">--:--:--</span>
          <span id="clock-date">----.--.--</span>
        </div>
      </header>

      <div class="hud-grid">
        <section class="widget widget--hardware" id="widget-hardware">
          <h2 class="widget-label">SYSTEM</h2>
          <div class="gauge-row">
            <div class="gauge">
              <canvas class="gauge-canvas" id="gauge-cpu" width="100" height="100"></canvas>
              <div class="gauge-value"><span id="cpu-val">--</span><span class="unit">%</span></div>
              <div class="gauge-name">CPU</div>
            </div>
            <div class="gauge">
              <canvas class="gauge-canvas" id="gauge-ram" width="100" height="100"></canvas>
              <div class="gauge-value"><span id="ram-val">--</span><span class="unit">%</span></div>
              <div class="gauge-name">RAM</div>
            </div>
            <div class="gauge">
              <canvas class="gauge-canvas" id="gauge-gpu" width="100" height="100"></canvas>
              <div class="gauge-value"><span id="gpu-val">--</span><span class="unit">%</span></div>
              <div class="gauge-name">GPU</div>
            </div>
          </div>
        </section>

        <section class="widget widget--github" id="widget-github">
          <h2 class="widget-label">GITHUB</h2>
          <div class="widget-body">
            <span class="disconnected">not connected</span>
          </div>
        </section>

        <section class="widget widget--email" id="widget-email">
          <h2 class="widget-label">MAIL</h2>
          <div class="widget-body">
            <div class="mail-summary" id="mail-summary">
              <span class="disconnected">connecting…</span>
            </div>
            <ul class="mail-list" id="mail-list"></ul>
          </div>
        </section>

        <section class="widget widget--stag" id="widget-stag">
          <h2 class="widget-label">STAG / ZČU</h2>
          <div class="widget-body">
            <span class="disconnected">not connected</span>
          </div>
        </section>

        <section class="widget widget--music" id="widget-music">
          <h2 class="widget-label">NOW PLAYING</h2>
          <div class="widget-body">
            <div class="track-title" id="music-title">--</div>
            <div class="track-artist" id="music-artist">--</div>
            <div class="music-controls" id="music-controls">
              <button class="music-btn" data-action="previous" aria-label="Previous track">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>
              <button class="music-btn music-btn--play" id="music-playpause" data-action="playpause" aria-label="Play or pause">
                <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
              </button>
              <button class="music-btn" data-action="next" aria-label="Next track">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
              </button>
            </div>
            <ul class="playlist-list" id="playlist-list"></ul>
          </div>
        </section>

        <section class="widget widget--screentime" id="widget-screentime">
          <h2 class="widget-label">SCREEN TIME</h2>
          <div class="widget-body">
            <span class="disconnected">not tracking</span>
          </div>
        </section>

        <section class="widget widget--discord" id="widget-discord">
          <h2 class="widget-label">DISCORD</h2>
          <div class="widget-body">
            <span class="disconnected">not connected</span>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
